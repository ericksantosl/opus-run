<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpusRun | Cadastro</title>
    <!--css-->
    <link rel="stylesheet" href="public/css/style.css">
    <!--tailwind-->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--font awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body class="bg-zinc-950 text-white">
    <main class="min-h-screen flex items-center justify-center px-6">
        <!--formulario cadastro-->
        <section class="w-full max-w-md">

            <!--logo-->
            <a href="index.html">
                <div class="flex justify-center items-center gap-1 mb-8">
                    <i class="fa-solid fa-check text-3xl text-violet-600"></i>

                    <h1 class="text-3xl font-bold">Opus<span class="text-violet-600">Run</span></h1>
                </div>
            </a>
            <!--fim logo-->

            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8">

                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold">Crie sua conta</h2>

                    <p class="text-sm text-zinc-400 mt-2">Cadastre-se para começar a organizar suas tarefas.</p>
                </div>

                <form id="formCadastro" class="flex flex-col gap-4" autocomplete="off">

                    <div>
                        <label for="nome" class="block mb-2">Nome:</label>

                        <input type="text" name="nome" id="nome" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-600" required>
                    </div>

                    <div>
                        <label for="email" class="block mb-2">E-mail:</label>

                        <input type="email" name="email" id="email" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-600" required>
                    </div>

                    <div>
                        <label for="senha" class="block mb-2">Senha:</label>

                        <input type="password" name="senha" id="senha" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-600" required>
                    </div>

                    <div>
                        <label for="confirmarSenha" class="block mb-2">Confirmar senha:</label>

                        <input type="password" name="confirmarSenha" id="confirmarSenha" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 focus:outline-none focus:border-violet-600" required>
                    </div>

                    <button type="submit" class="bg-violet-600 hover:bg-violet-700 rounded-xl py-3 transition duration-300">Cadastrar</button>
                </form>

                <div class="text-center mt-6">

                    <p class="text-sm text-zinc-400">Já possui uma conta? <a href="login.html" class="text-violet-600 hover:text-violet-500">Faça login</a></p>

                </div>

            </div>

            <div class="text-center mt-6">
                <a href="index.html" class="text-sm text-zinc-400 hover:text-violet-600 transition duration-300"><i class="fa-solid fa-arrow-left mr-1"></i>Voltar para a página inicial</a>
            </div>
        </section>
        <!--fim formulario cadastro-->

    </main>
    <script src="public/js/cadastro.js"></script>
</body>
</html>
